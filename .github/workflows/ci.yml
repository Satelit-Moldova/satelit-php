name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.2", "7.4", "8.1", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none
      - name: lint
        run: find src tests examples -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: install
        run: composer update --no-interaction --prefer-dist --no-progress
      - name: test (offline)
        run: vendor/bin/phpunit
